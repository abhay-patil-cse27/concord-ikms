name: CONCORD CI Quality Gate

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite & OCR (Python 3.11)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      ENVIRONMENT: test
      SECRET_KEY: ci-cd-secret-key-for-automated-testing-32-chars-min
      DEMO_MODE_ENABLED: "true"
      CHROMA_PERSIST_DIR: /tmp/chroma_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite (97 Tests)
        run: |
          python -m pytest backend/tests -v --durations=10

  frontend-tests:
    name: Frontend Unit Tests & Production Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Frontend Cache Isolation & Speech Unit Tests
        run: |
          npm --prefix frontend test

      - name: Verify Production Vite Bundle Build
        run: |
          npm --prefix frontend run build

  docker-gate:
    name: Docker Infrastructure & Container Build Gate
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Verify Backend Container Build
        run: |
          docker build -f infra/docker/backend.Dockerfile -t concord-backend:ci .

      - name: Verify Frontend Container Build
        run: |
          docker build -f infra/docker/frontend.Dockerfile -t concord-frontend:ci .
